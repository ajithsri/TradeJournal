<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade Journal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Main">
      <a class="brand" href="#/dashboard">Trade Journal</a>
      <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#/trades" data-nav="trades">Trades</a>
      <a href="#/daily" data-nav="daily">Daily journal</a>
      <a href="#/reports" data-nav="reports">Reports</a>
      <a href="#/sync" data-nav="sync">Sync and settings</a>
      <div class="sidebar-foot" id="lastSync"></div>
    </nav>

    <main>
      <header class="filterbar" id="filterbar">
        <div class="seg" role="group" aria-label="Date range" id="rangeSeg">
          <button data-range="7">7D</button>
          <button data-range="30">30D</button>
          <button data-range="90">90D</button>
          <button data-range="ytd">YTD</button>
          <button data-range="365">1Y</button>
          <button data-range="all">All</button>
        </div>
        <label class="date-field">From <input type="date" id="fFrom"></label>
        <label class="date-field">To <input type="date" id="fTo"></label>
        <div class="seg" role="group" aria-label="Instrument" id="assetSeg">
          <button data-asset="">All</button>
          <button data-asset="OPT">Options</button>
          <button data-asset="STK">Stocks</button>
        </div>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
